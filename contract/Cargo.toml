[package]
name = "fewer"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "FEWER: a NEP-141 memecoin whose daily ritual is a stake-weighted minority game"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"
near-contract-standards = "5.30"
uint = { version = "0.9", default-features = false }

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
